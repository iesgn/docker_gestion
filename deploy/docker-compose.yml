version: '3'

services:

  gestion:
    container_name: gestiona_gonzalonazareno_org
    image: iesgn/gestiona:$VERSION_DEPLOY
    volumes:
      - /opt/gestion/basededatos:/usr/share/app/basededatos
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - '$PORT_DEPLOY:8000'
    
    restart: always
